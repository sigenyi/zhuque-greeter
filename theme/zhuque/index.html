<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>朱雀终端</title>
  <link rel="stylesheet" href="css/zhuque.css">
</head>
<body class="primary">
  <main class="term" id="term">
    <div id="console" class="console" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <nav class="sysmenu" id="sysmenu"></nav>
  </footer>

  <div class="clock">
    <div class="time" id="clock-time"></div>
    <div class="date" id="clock-date"></div>
  </div>

  <input id="entry" class="entry" type="password" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" aria-label="终端输入">

  <script src="js/zhuque.js"></script>
</body>
</html>
